name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # js 后端要 Node 才能跑
      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit 版本
        run: moon version

      - name: 更新注册表索引
        run: moon update

      - name: 格式检查
        run: moon fmt --check

      - name: 检查
        run: moon check --target wasm-gc --deny-warn

      - name: 构建
        run: moon build --target wasm-gc

      - name: 测试
        run: moon test --target wasm-gc

      # 解析逻辑不依赖后端特性，js 后端应解出同样的结果
      - name: 测试（js 后端）
        run: moon test --target js

      # 用独立实现（Python struct）重新解析真实 profile 并重做 matrix/TRC 变换，
      # 与库的输出逐字段、逐样本比对，证明结果不是"自己说自己对"
      - name: 外部 oracle 差分（wasm-gc）
        run: python3 tools/diff_oracle.py wasm-gc

      - name: 外部 oracle 差分（js）
        run: python3 tools/diff_oracle.py js
